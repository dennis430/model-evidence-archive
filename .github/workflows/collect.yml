name: Collect Panel

on:
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector (dry)
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.collector.collector import run_collection
          import json
          print(json.dumps(run_collection(dry_run=True), indent=2))
          "
      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: collection-status
          path: |
            probes/
